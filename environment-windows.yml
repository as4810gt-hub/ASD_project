name: asd-homecoach

channels:
  - nvidia
  - conda-forge
  - nodefaults

dependencies:
  # Python 3.10 has Windows wheels for the pinned ML packages below.
  - python=3.10
  - pip>=24
  - setuptools
  - wheel
  # faster-whisper/CTranslate2 GPU runtime (NVIDIA GPU, native Windows).
  - cuda-version=12.4
  - cuda-runtime=12.4
  - cudnn=9
  - pip:
      - Flask==3.1.1
      - numpy==1.26.4
      - scikit-learn==1.7.2
      - xgboost==2.0.3
      - opencv-python==4.9.0.80
      - Pillow==10.4.0
      - deepface==0.0.100
      - tensorflow==2.16.1
      - tf-keras==2.16.0
      - h5py==3.10.0
      # Keep the bundled source editable so HomeCoach uses this checkout.
      - -e ./faster-whisper-master

variables:
  WHISPER_DEVICE: cuda
  WHISPER_COMPUTE_TYPE: float16
